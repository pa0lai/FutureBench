region: the_United_States
split: english
year_min: 2023
year_max: 2024
start_month: 1
end_month: 1
retriever:
  provider: openai
  encoder: text-embedding-3-small
  batch_size: 64
  topk: 10
  api_key_env: OPENAI_API_KEY
model:
  provider: openrouter
  name: openai/gpt-4.1-mini
  endpoint: https://openrouter.ai/api/v1
  max_tokens: 4096
  timeout: 120
  workers: 10
  temperature: 0.0
eval:
  modes:
  - openqa
  ctx_types:
  - 'false'
  seed: 7
output_dir: runs/OnlyQuestion/new/openai/gpt-4.1-mini/
